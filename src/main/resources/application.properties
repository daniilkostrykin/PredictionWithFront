# \u041F\u043E\u0440\u0442, \u043D\u0430 \u043A\u043E\u0442\u043E\u0440\u043E\u043C \u0431\u0443\u0434\u0435\u0442 \u0437\u0430\u043F\u0443\u0449\u0435\u043D\u043E \u043F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u0435
server.port=8080

# \u041D\u0430\u0437\u0432\u0430\u043D\u0438\u0435 Spring \u043F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u044F
spring.application.name=PredictionApp

# URL \u0434\u043B\u044F \u043F\u043E\u0434\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u044F \u043A \u0431\u0430\u0437\u0435 \u0434\u0430\u043D\u043D\u044B\u0445 PostgreSQL (\u0432\u043A\u043B\u044E\u0447\u0430\u0435\u0442 \u0443\u043A\u0430\u0437\u0430\u043D\u0438\u0435 \u0441\u0445\u0435\u043C\u044B)
spring.datasource.url=jdbc:postgresql://localhost:5433/prediction_db?currentSchema=prediction_schema
# \u0418\u043C\u044F \u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u0435\u043B\u044F \u0434\u043B\u044F \u043F\u043E\u0434\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u044F \u043A \u0431\u0430\u0437\u0435 \u0434\u0430\u043D\u043D\u044B\u0445
spring.datasource.username=user
# \u041F\u0430\u0440\u043E\u043B\u044C \u0434\u043B\u044F \u043F\u043E\u0434\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u044F \u043A \u0431\u0430\u0437\u0435 \u0434\u0430\u043D\u043D\u044B\u0445
spring.datasource.password=pass
# \u041A\u043B\u0430\u0441\u0441 \u0434\u0440\u0430\u0439\u0432\u0435\u0440\u0430 JDBC \u0434\u043B\u044F PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
# \u0423\u0441\u0442\u0430\u043D\u043E\u0432\u043A\u0430 \u0441\u0445\u0435\u043C\u044B \u043F\u043E \u0443\u043C\u043E\u043B\u0447\u0430\u043D\u0438\u044E \u0434\u043B\u044F Hibernate
spring.jpa.properties.hibernate.default_schema=prediction_schema
# \u041F\u0443\u0442\u044C \u043A \u0444\u0430\u0439\u043B\u0443 SQL \u0441\u0445\u0435\u043C\u044B \u0434\u043B\u044F \u0438\u043D\u0438\u0446\u0438\u0430\u043B\u0438\u0437\u0430\u0446\u0438\u0438 \u0411\u0414
spring.sql.init.schema-locations=classpath:db/schema.sql
# \u041F\u0443\u0442\u044C \u043A \u0444\u0430\u0439\u043B\u0443 SQL \u0441 \u043D\u0430\u0447\u0430\u043B\u044C\u043D\u044B\u043C\u0438 \u0434\u0430\u043D\u043D\u044B\u043C\u0438 \u0434\u043B\u044F \u0438\u043D\u0438\u0446\u0438\u0430\u043B\u0438\u0437\u0430\u0446\u0438\u0438 \u0411\u0414
spring.sql.init.data-locations=classpath:db/data.sql
# \u0420\u0435\u0436\u0438\u043C \u0438\u043D\u0438\u0446\u0438\u0430\u043B\u0438\u0437\u0430\u0446\u0438\u0438 \u0411\u0414: always - \u0432\u0441\u0435\u0433\u0434\u0430 \u0432\u044B\u043F\u043E\u043B\u043D\u044F\u0442\u044C \u0438\u043D\u0438\u0446\u0438\u0430\u043B\u0438\u0437\u0430\u0446\u0438\u044E \u043F\u0440\u0438 \u0441\u0442\u0430\u0440\u0442\u0435
spring.sql.init.mode=never

# \u0420\u0435\u0436\u0438\u043C \u0440\u0430\u0431\u043E\u0442\u044B Hibernate DDL: update - \u043E\u0431\u043D\u043E\u0432\u043B\u044F\u0435\u0442 \u0441\u0445\u0435\u043C\u0443, \u043D\u0435 \u0443\u0434\u0430\u043B\u044F\u044F \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0443\u044E\u0449\u0438\u0435 \u0434\u0430\u043D\u043D\u044B\u0435
spring.jpa.hibernate.ddl-auto=create

# \u0424\u043E\u0440\u043C\u0430\u0442\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435 SQL \u0437\u0430\u043F\u0440\u043E\u0441\u043E\u0432 Hibernate \u0434\u043B\u044F \u043B\u0443\u0447\u0448\u0435\u0439 \u0447\u0438\u0442\u0430\u0435\u043C\u043E\u0441\u0442\u0438
spring.jpa.properties.hibernate.format_sql=true
# \u0412\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u0435 \u0444\u0438\u043B\u044C\u0442\u0440\u0430 \u0434\u043B\u044F \u0441\u043A\u0440\u044B\u0442\u044B\u0445 \u043C\u0435\u0442\u043E\u0434\u043E\u0432 HTTP (\u0434\u043B\u044F PUT, DELETE)
spring.mvc.hiddenmethod.filter.enabled=true
# \u041E\u0442\u043B\u043E\u0436\u0438\u0442\u044C \u0438\u043D\u0438\u0446\u0438\u0430\u043B\u0438\u0437\u0430\u0446\u0438\u044E \u0438\u0441\u0442\u043E\u0447\u043D\u0438\u043A\u0430 \u0434\u0430\u043D\u043D\u044B\u0445 \u0434\u043E \u043F\u0435\u0440\u0432\u043E\u0433\u043E \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u043D\u0438\u044F
spring.jpa.defer-datasource-initialization=true

# \u0425\u043E\u0441\u0442 Redis \u0441\u0435\u0440\u0432\u0435\u0440\u0430 \u0434\u043B\u044F \u043A\u044D\u0448\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u044F
spring.data.redis.host=localhost
# \u041F\u043E\u0440\u0442 Redis \u0441\u0435\u0440\u0432\u0435\u0440\u0430
spring.data.redis.port=6379
# \u0422\u0438\u043F \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0435\u043C\u043E\u0433\u043E \u043A\u044D\u0448\u0430: Redis
spring.cache.type=redis
# \u0412\u0440\u0435\u043C\u044F \u0436\u0438\u0437\u043D\u0438 \u044D\u043B\u0435\u043C\u0435\u043D\u0442\u043E\u0432 \u043A\u044D\u0448\u0430 \u0432 Redis (\u0432 \u043C\u0438\u043B\u043B\u0438\u0441\u0435\u043A\u0443\u043D\u0434\u0430\u0445)
spring.cache.redis.time-to-live=600000

# \u041F\u043E\u043A\u0430\u0437\u044B\u0432\u0430\u0442\u044C \u043B\u0438 SQL \u0437\u0430\u043F\u0440\u043E\u0441\u044B \u0432 \u043B\u043E\u0433\u0430\u0445 (false - \u043D\u0435 \u043F\u043E\u043A\u0430\u0437\u044B\u0432\u0430\u0442\u044C)
spring.jpa.show-sql=false
# \u0423\u0440\u043E\u0432\u0435\u043D\u044C \u043B\u043E\u0433\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u044F SQL \u0437\u0430\u043F\u0440\u043E\u0441\u043E\u0432 Hibernate
logging.level.org.hibernate.SQL=DEBUG
# \u0423\u0440\u043E\u0432\u0435\u043D\u044C \u043B\u043E\u0433\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u044F \u043F\u0440\u0438\u0432\u044F\u0437\u043A\u0438 \u043F\u0430\u0440\u0430\u043C\u0435\u0442\u0440\u043E\u0432 SQL \u0437\u0430\u043F\u0440\u043E\u0441\u043E\u0432
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# \u0423\u0440\u043E\u0432\u0435\u043D\u044C \u043B\u043E\u0433\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u044F \u0434\u043B\u044F \u043F\u0430\u043A\u0435\u0442\u0430 org.example.prediction
logging.level.org.example.prediction=DEBUG
# \u0423\u0440\u043E\u0432\u0435\u043D\u044C \u043B\u043E\u0433\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u044F Spring Security
logging.level.org.springframework.security=DEBUG
# \u0423\u0440\u043E\u0432\u0435\u043D\u044C \u043B\u043E\u0433\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u044F Spring Web
logging.level.org.springframework.web=DEBUG
# \u0423\u0440\u043E\u0432\u0435\u043D\u044C \u043B\u043E\u0433\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u044F Hibernate
logging.level.org.hibernate=INFO

# \u041E\u0442\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u0435 \u043A\u044D\u0448\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u044F \u0448\u0430\u0431\u043B\u043E\u043D\u043E\u0432 Thymeleaf \u0434\u043B\u044F \u0440\u0430\u0437\u0440\u0430\u0431\u043E\u0442\u043A\u0438
spring.thymeleaf.cache=false

# \u0411\u0440\u043E\u0441\u0430\u0442\u044C \u0438\u0441\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u0435, \u0435\u0441\u043B\u0438 \u043D\u0435 \u043D\u0430\u0439\u0434\u0435\u043D \u043E\u0431\u0440\u0430\u0431\u043E\u0442\u0447\u0438\u043A \u0434\u043B\u044F \u0437\u0430\u043F\u0440\u043E\u0441\u0430
spring.mvc.throw-exception-if-no-handler-found=true

# 1. \u041F\u0440\u0438\u043D\u0443\u0434\u0438\u0442\u0435\u043B\u044C\u043D\u043E \u0437\u0430\u0434\u0430\u0435\u043C \u0438\u043C\u044F \u043A\u0443\u043A\u0438, \u043A\u043E\u0442\u043E\u0440\u043E\u0435 Spring Security \u0431\u0443\u0434\u0435\u0442 \u0438\u0441\u043A\u0430\u0442\u044C
server.servlet.session.cookie.name=SESSION

# 2. \u041D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0430 SameSite=Lax \u043F\u043E\u0437\u0432\u043E\u043B\u044F\u0435\u0442 \u043A\u0443\u043A\u0435 "\u043F\u0443\u0442\u0435\u0448\u0435\u0441\u0442\u0432\u043E\u0432\u0430\u0442\u044C" \u043C\u0435\u0436\u0434\u0443 localhost:3000 \u0438 localhost:8080
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# 3. \u0414\u043E\u043F\u043E\u043B\u043D\u0438\u0442\u0435\u043B\u044C\u043D\u043E \u0440\u0430\u0437\u0440\u0435\u0448\u0438\u043C \u043F\u0435\u0440\u0435\u0434\u0430\u0447\u0443 \u043A\u0443\u043A \u0431\u0435\u0437 HTTPS (\u0442\u0430\u043A \u043A\u0430\u043A \u0443 \u0442\u0435\u0431\u044F localhost)
server.servlet.session.cookie.secure=false
